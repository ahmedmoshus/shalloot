<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>شلووت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#050b16;overflow:hidden;touch-action:none;font-family:'Lilita One','Cairo',system-ui,sans-serif;color:#fff}
#app{position:absolute;transform-origin:0 0;overflow:hidden;background:#0a1a10}
canvas#c{position:absolute;left:0;top:0;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.outl{paint-order:stroke fill;-webkit-text-stroke:12px #0b1020}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:44px;box-shadow:0 9px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .08s}
.btn:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn small{font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;white-space:nowrap;opacity:.85;margin-top:6px}
#menu{background:linear-gradient(rgba(5,12,28,.62),rgba(5,20,12,.25) 40%,rgba(5,20,12,.78))}
.title{margin-top:70px;text-align:center;transform:rotate(-3deg);line-height:.84;position:relative}
.t1{font-size:190px;color:#fff;display:block}
.t2{font-family:Cairo,sans-serif;font-weight:900;line-height:1.3;font-size:170px;color:#ffd23a;display:block}
#titleBall{position:absolute;right:-30px;top:10px;width:100px;height:100px}
.avatar{margin-top:28px;width:210px;height:210px;border-radius:50%;border:10px solid #ffd23a;background:radial-gradient(#4b7fe8,#1c3a8a);display:flex;align-items:center;justify-content:center;font-size:118px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.season{margin-top:16px;font-size:46px;letter-spacing:1px;-webkit-text-stroke:8px #0b1020;paint-order:stroke fill;font-family:'Lilita One','Cairo'}
.menubtns{margin-top:36px;width:624px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:24px}
.row .btn{flex:1}
.b-end{height:146px;font-size:76px;background:linear-gradient(#ffd54a,#ffb300);color:#2a1700}
.b-daily{height:150px;font-size:46px;white-space:nowrap;background:linear-gradient(#8aeaff,#38bff2);color:#07263a}
.b-blitz{height:150px;font-size:46px;white-space:nowrap;background:linear-gradient(#ffa6ca,#ff6aa5);color:#3b0720}
.b-white{height:120px;font-size:50px;flex-direction:row;gap:12px;background:#f4f7fb;color:#2a1700}
.round{position:absolute;bottom:40px;width:84px;height:84px;border-radius:50%;border:0;background:rgba(0,0,0,.5);font-size:42px;display:flex;align-items:center;justify-content:center}
#hud{position:absolute;inset:0;pointer-events:none}
#hScore{position:absolute;top:30px;left:0;right:0;text-align:center;font-size:118px}
#hSub{position:absolute;top:168px;left:0;right:0;text-align:center;font-size:46px;color:#ffd23a;-webkit-text-stroke:7px #0b1020;paint-order:stroke fill}
#hLeft{position:absolute;left:28px;top:40px;font-size:58px;-webkit-text-stroke:8px #0b1020;paint-order:stroke fill}
#btnPause{position:absolute;right:26px;top:34px;pointer-events:auto;width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.5);border:0;font-size:44px}
#msg{position:absolute;left:0;right:0;top:31%;text-align:center;font-size:150px;opacity:0;-webkit-text-stroke:14px #0b1020;paint-order:stroke fill}
#msg small{display:block;font-size:58px;color:#ffd23a;-webkit-text-stroke:8px #0b1020;margin-top:4px}
#msg.good{color:#7dff8a}#msg.bad{color:#ff7b7b}
#msg.pop{animation:pop 1.2s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}14%{transform:scale(1.15);opacity:1}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
#hWind{position:absolute;left:28px;top:128px;font-size:40px;-webkit-text-stroke:7px #0b1020;paint-order:stroke fill}
#hStage{position:absolute;top:226px;left:0;right:0;text-align:center;font-size:36px;opacity:.85;-webkit-text-stroke:6px #0b1020;paint-order:stroke fill}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.gold{background:radial-gradient(circle at 50% 40%,rgba(255,240,160,.6),rgba(255,210,58,0) 70%);animation:fl .6s ease-out}
#flash.red{box-shadow:inset 0 0 170px 45px rgba(255,40,40,.7);animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.title{animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-1.5deg) scale(1.035)}}
.avatar{animation:flo 2.8s ease-in-out infinite}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.b-end{position:relative;overflow:hidden}
.b-end::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:140%}}
.b-daily,.b-blitz{animation:pulse 2.6s ease-in-out infinite}.b-blitz{animation-delay:.6s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
#hint{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:46px;-webkit-text-stroke:8px #0b1020;paint-order:stroke fill;opacity:.95}
.panel{background:rgba(6,16,30,.92);justify-content:flex-start;padding:40px 36px}
.hdr{display:flex;align-items:center;width:100%;gap:20px;margin-bottom:24px}
.hdr h2{margin:0;font-size:80px;flex:1;text-align:center}
.back{width:96px;height:96px;border-radius:50%;border:0;background:#f4f7fb;color:#2a1700;font-size:48px}
.tabs{display:flex;gap:14px;width:100%;margin-bottom:20px}
.tab{flex:1;height:84px;border-radius:26px;border:0;background:#1b2a44;font-size:38px}
.tab.on{background:#ffd54a;color:#2a1700}
#rlist{width:100%;display:flex;flex-direction:column;gap:12px}
.rrow{display:flex;align-items:center;gap:18px;background:#13213a;border-radius:24px;padding:16px 24px;font-size:42px}
.rrow b{width:60px;color:#ffd23a}.rrow span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rrow i{font-style:normal;color:#9fb3d6;font-size:30px;font-family:'Cairo'}
.note{font-family:'Cairo';font-weight:700;font-size:30px;color:#9fb3d6;margin-top:18px;text-align:center}
#nameIn{width:100%;height:84px;border-radius:24px;border:3px solid #2c4166;background:#0d1a2f;color:#fff;font-size:42px;padding:0 24px;font-family:inherit;margin-bottom:20px;user-select:text;-webkit-user-select:text}
#bgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;width:100%}
.bcell{background:#13213a;border-radius:34px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;border:6px solid transparent;font-size:44px}
.bcell.sel{border-color:#ffd54a}
.bcell.lock{opacity:.55}
.bcell small{font-family:'Cairo';font-weight:900;font-size:30px;color:#9fb3d6}
#over{background:rgba(0,0,0,.68);justify-content:center}
.card{width:600px;background:linear-gradient(#17305a,#0d1a30);border-radius:50px;padding:44px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);border:6px solid #2c4a80}
.card h2{margin:0;font-size:84px;color:#ffd23a}
.card .big{font-size:150px;line-height:1;margin:10px 0}
.card p{margin:6px 0;font-family:'Cairo';font-weight:900;font-size:38px;color:#cfe0ff}
.card .btn{width:100%;height:120px;font-size:56px;margin-top:22px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="hLeft"></div>
    <div id="hScore" class="outl">0</div>
    <div id="flash"></div><div id="hSub"></div><div id="hWind"></div><div id="hStage"></div>
    <button id="btnPause">⏸</button>
    <div id="msg"></div>
    <div id="hint"></div>
  </div>

  <div id="menu" class="screen">
    <div class="title outl">
      <span class="t2 outl">شلووت</span>
      <canvas id="titleBall" width="120" height="120"></canvas>
    </div>
    <div class="avatar" id="avatar">🤠</div>
    <div class="season"><span id="seasonN">0</span> <span data-i="season"></span></div>
    <div class="menubtns">
      <button class="btn b-end" id="bEndless"><span data-i="endless"></span><small><span data-i="best"></span> <span id="bestE">0</span></small></button>
      <div class="row">
        <button class="btn b-daily" id="bDaily"><span data-i="daily"></span><small><span data-i="dailySub"></span> · 🔥 <span id="streakN">0</span></small></button>
        <button class="btn b-blitz" id="bBlitz"><span>⏱ <span data-i="blitz"></span></span><small><span data-i="blitzSub"></span> · <span id="bestB">0</span></small></button>
      </div>
      <div class="row">
        <button class="btn b-white" id="bRanks">🏆 <span data-i="ranks"></span></button>
        <button class="btn b-white" id="bBalls">⚽ <span data-i="balls"></span></button>
      </div>
    </div>
    <button class="round" id="bSound" style="left:40px">🔊</button>
    <button class="round" id="bLang" style="right:40px;font-size:34px">AR</button>
  </div>

  <div id="ranks" class="screen panel hidden">
    <div class="hdr"><button class="back" data-back>←</button><h2 data-i="ranks"></h2><div style="width:96px"></div></div>
    <input id="nameIn" maxlength="14" autocomplete="off">
    <div class="tabs"><button class="tab" data-tab="endless" data-i="endless"></button><button class="tab" data-tab="daily" data-i="daily"></button><button class="tab" data-tab="blitz" data-i="blitz"></button></div>
    <div id="rlist"></div>
    <div class="note" data-i="localNote"></div>
  </div>

  <div id="balls" class="screen panel hidden">
    <div class="hdr"><button class="back" data-back>←</button><h2 data-i="balls"></h2><div style="width:96px"></div></div>
    <div id="bgrid"></div>
  </div>

  <div id="over" class="screen hidden"><div class="card" id="ovCard"></div></div>
</div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}

/* ============ i18n ============ */
const TXT={
en:{season:'SEASON POINTS',endless:'ENDLESS RUN',best:'BEST',daily:'DAILY CUP',dailySub:'same 5 shots',blitz:'BLITZ 60',blitzSub:'60 seconds',ranks:'RANKS',balls:'BALLS',
goal:'GOAL!',saved:'SAVED!',blocked:'BLOCKED!',wide:'WIDE',high:'TOO HIGH',post:'POST!',bar:'CROSSBAR!',curve:'CURVE',topbin:'TOP BIN',
hint:'Swipe up — draw the curve you want',over:'GAME OVER',timeup:"TIME'S UP!",dailyDone:'DAILY CUP DONE',again:'PLAY AGAIN',menu:'MENU',resume:'RESUME',paused:'PAUSED',
newbest:'NEW BEST!',score:'Score',bestIs:'Best',earned:'Season points earned',unlock:'Unlocks at',selected:'SELECTED',localNote:'Rankings are saved on this device only',
empty:'No runs yet — go score!',name:'Your name',streak:'Streak',shortSwipe:'Swipe longer, upward',classic:'Classic',gold:'Gold',fire:'Fire',ice:'Ice',neon:'Neon',galaxy:'Galaxy',shots:'Shot',stage:'STAGE',boss:'BOSS KEEPER',wind:'Wind'},
ar:{season:'نقاط الموسم',endless:'تحدي بلا نهاية',best:'الأفضل',daily:'كأس اليوم',dailySub:'نفس الـ5 تسديدات',blitz:'بليتز 60',blitzSub:'60 ثانية',ranks:'الترتيب',balls:'الكرات',
goal:'هدف!',saved:'تصدّى!',blocked:'صدّه الجدار!',wide:'خارج',high:'عالية جدًا',post:'القائم!',bar:'العارضة!',curve:'تسديدة ملتفّة',topbin:'الزاوية العليا',
hint:'اسحب للأعلى — ارسم المنحنى الذي تريده',over:'انتهت اللعبة',timeup:'انتهى الوقت!',dailyDone:'انتهى كأس اليوم',again:'العب مجددًا',menu:'القائمة',resume:'متابعة',paused:'متوقف',
newbest:'رقم قياسي جديد!',score:'النتيجة',bestIs:'الأفضل',earned:'نقاط الموسم المكتسبة',unlock:'يُفتح عند',selected:'محددة',localNote:'الترتيب محفوظ على هذا الجهاز فقط',
empty:'لا توجد محاولات بعد — سجّل هدفًا!',name:'اسمك',streak:'التتابع',shortSwipe:'اسحب أطول وللأعلى',classic:'كلاسيك',gold:'ذهبي',fire:'ناري',ice:'جليدي',neon:'نيون',galaxy:'مجرة',shots:'تسديدة',stage:'المرحلة',boss:'حارس البوس',wind:'رياح'}
};

/* ============ save ============ */
let S={points:0,best:{endless:0,blitz:0},daily:{last:'',streak:0,bests:{}},ball:0,name:'',lang:'',sound:true,runs:[]};
try{const o=JSON.parse(localStorage.getItem('curvekick1')||'{}');S=Object.assign(S,o);S.best=Object.assign({endless:0,blitz:0},o.best||{});S.daily=Object.assign({last:'',streak:0,bests:{}},o.daily||{});}catch(e){}
function save(){try{localStorage.setItem('curvekick1',JSON.stringify(S))}catch(e){}}
if(!S.lang)S.lang=(navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en';
if(!S.name)S.name=S.lang==='ar'?'لاعب':'Player';
const t=k=>TXT[S.lang][k]||k;

/* ============ canvas / layout ============ */
const W=720;let H=1280,K=1,DPR=1,HZ=346;
const app=$('#app'),cv=$('#c'),ctx=cv.getContext('2d'),bgc=document.createElement('canvas');
const F=1328,CAMY=2.0;           // focal length, camera height
const cam={x:0,sh:0};
function resize(){
  const iw=innerWidth,ih=innerHeight;
  H=clamp(Math.round(W*ih/iw),1100,1700);
  K=Math.min(iw/W,ih/H);DPR=Math.min(window.devicePixelRatio||1,2);
  app.style.width=W+'px';app.style.height=H+'px';
  app.style.transform='scale('+K+')';
  app.style.left=((iw-W*K)/2)+'px';app.style.top=((ih-H*K)/2)+'px';
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*K*DPR);cv.height=Math.round(H*K*DPR);
  HZ=H*0.27;buildBg();
}
const THEMES=[
 {sky:['#04061a','#16295e'],grass:['#1d7733','#238c3d','#1c7130'],flood:'255,255,230'},
 {sky:['#2a0f3a','#ff9a4a'],grass:['#2a8a3a','#33a24a','#277f38'],flood:'255,214,150'},
 {sky:['#5fa8ee','#d6eeff'],grass:['#2f9a47','#3db45a','#2b8a3f'],flood:'255,255,255'},
 {sky:['#14002e','#6a1fb8'],grass:['#0f6a52','#148565','#0d5e48'],flood:'200,150,255'}];
let curTheme=0;

const crowdc=document.createElement('canvas'),frontc=document.createElement('canvas');
function layer(c){c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.setTransform(K*DPR,0,0,K*DPR,0,0);g.clearRect(0,0,W,H);return g}
const FAN_SKIN=['#f2d0b0','#d9a87a','#a5714a','#7a4a2d','#ffe0c4'],FAN_SHIRT=['#e63946','#ffd23a','#2ec4b6','#7b5cff','#ffffff','#2d7bff','#ff8c42','#222a44','#43c06a'];
function buildBg(){
  const TH=THEMES[curTheme],r=mulberry(11+curTheme*7);
  // ---- sky
  let g=layer(bgc);
  let gr=g.createLinearGradient(0,0,0,HZ);gr.addColorStop(0,TH.sky[0]);gr.addColorStop(1,TH.sky[1]);g.fillStyle=gr;g.fillRect(0,0,W,HZ);
  // ---- crowd (figures)
  g=layer(crowdc);
  const top=HZ-345,bot=HZ-54;
  g.fillStyle='#0a1024';g.fillRect(0,0,W,bot+2);
  let y=top>0?-24:top,row=0;
  while(y<bot){
    const sz=8+Math.max(0,y-top)/(bot-top)*9,step=sz*1.55;
    for(let x=-sz+(row%2)*sz*.6;x<W+sz;x+=sz*1.15){
      const jx=x+(r()-.5)*sz*.4,sk=FAN_SKIN[(r()*5)|0],sh=FAN_SHIRT[(r()*9)|0];
      if(r()<.2){g.strokeStyle=sh;g.lineWidth=sz*.2;g.lineCap='round';g.beginPath();g.moveTo(jx-sz*.35,y+sz*.7);g.lineTo(jx-sz*.55,y-sz*.35);g.moveTo(jx+sz*.35,y+sz*.7);g.lineTo(jx+sz*.55,y-sz*.35);g.stroke();g.fillStyle=sk;g.beginPath();g.arc(jx-sz*.55,y-sz*.4,sz*.1,0,7);g.arc(jx+sz*.55,y-sz*.4,sz*.1,0,7);g.fill()}
      g.fillStyle=sh;g.beginPath();g.ellipse(jx,y+sz*.95,sz*.55,sz*.7,0,0,7);g.fill();
      g.fillStyle=sk;g.beginPath();g.arc(jx,y+sz*.18,sz*.32,0,7);g.fill();
      g.fillStyle=r()<.5?'#1b1209':'#5a3a1a';g.beginPath();g.arc(jx,y+sz*.1,sz*.32,Math.PI*1.05,Math.PI*1.95);g.fill();
      if(r()<.018){g.strokeStyle='#ddd';g.lineWidth=2;g.beginPath();g.moveTo(jx+sz*.6,y+sz*.8);g.lineTo(jx+sz*.6,y-sz*1.6);g.stroke();g.fillStyle=FAN_SHIRT[(r()*9)|0];g.fillRect(jx+sz*.6,y-sz*1.6,sz*1.3,sz*.8)}
    }
    if(row%5===4){g.fillStyle='rgba(20,28,52,.95)';g.fillRect(0,y+sz*1.5,W,4);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,y+sz*1.5,W,1.5)}
    y+=step;row++;
  }
  gr=g.createLinearGradient(0,Math.min(0,top),0,bot);gr.addColorStop(0,'rgba(2,4,16,.72)');gr.addColorStop(.6,'rgba(2,4,16,.15)');gr.addColorStop(1,'rgba(2,4,16,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,bot+2);
  for(const lx of [60,660]){const bg=g.createLinearGradient(0,top,0,bot);bg.addColorStop(0,'rgba('+TH.flood+',.22)');bg.addColorStop(1,'rgba('+TH.flood+',0)');g.fillStyle=bg;g.beginPath();g.moveTo(lx-14,top);g.lineTo(lx+14,top);g.lineTo(lx+(lx<360?260:-260),bot);g.lineTo(lx+(lx<360?-120:120),bot);g.closePath();g.fill()}
  for(const lx of [90,360,630]){const lg=g.createRadialGradient(lx,top+16,2,lx,top+16,190);lg.addColorStop(0,'rgba('+TH.flood+',.95)');lg.addColorStop(1,'rgba('+TH.flood+',0)');g.fillStyle=lg;g.fillRect(lx-190,top-170,380,380)}
  // ---- front: ads + pitch
  g=layer(frontc);
  const by=HZ-52,cols=['#e63946','#ffd23a','#2ec4b6','#7b5cff'];
  g.fillStyle='#070c1e';g.fillRect(0,by,W,52);
  for(let i=0;i<6;i++){
    const x=i*120;gr=g.createLinearGradient(0,by+5,0,by+47);gr.addColorStop(0,cols[i%4]);gr.addColorStop(1,'rgba(0,0,0,.55)');
    g.fillStyle=cols[i%4];g.fillRect(x+5,by+5,110,42);g.fillStyle=gr;g.globalAlpha=.55;g.fillRect(x+5,by+5,110,42);g.globalAlpha=1;
    g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x+5,by+5,110,12);
    g.fillStyle='#fff';g.font='900 25px Cairo,Arial';g.textAlign='center';g.fillText('شلووت',x+60,by+38);
  }
  g.fillStyle=TH.grass[0];g.fillRect(0,HZ,W,H-HZ);
  for(let i=0;i<40;i++){const z0=-4.5+i*3,y0=HZ+CAMY*F/(z0+5),y1=HZ+CAMY*F/(z0+8);g.fillStyle=i%2?TH.grass[1]:TH.grass[2];g.fillRect(0,y1,W,y0-y1+1)}
  for(let i=0;i<7000;i++){const yy=HZ+r()*(H-HZ),k=(yy-HZ)/(H-HZ),sz=.5+k*2.4;g.fillStyle=r()<.5?'rgba(255,255,255,.055)':'rgba(0,0,0,.07)';g.fillRect(r()*W,yy,sz*2.2,sz*.7)}

  const s=G.setup,b=G.ball;if(!s)return;
  const ps=proj(b.x,0,b.z);shadow(ps.x,ps.y,R*ps.s*1.6,R*ps.s*.55,.5*Math.max(.25,1-b.y/6));
  {const n=G.cheer>0?Math.min(18,(G.cheer*9)|0):(Math.random()<.07?1:0);for(let i=0;i<n;i++){ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.9)+')';ctx.fillRect(Math.random()*W,HZ-330+Math.random()*270,6,6)}}
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawLines(s);
  const items=[{z:s.dist+2,f:drawNet},{z:s.dist-.3,f:drawKeeper},{z:s.dist,f:drawFrame},{z:s.wallZ,f:drawWall},{z:b.z,f:drawBallItem}];
  items.sort((a,c)=>c.z-a.z);items.forEach(i=>i.f());ctx.restore();
  if(G.state==='kicking'||(G.state==='flight'&&G.ball.t<.1))drawLeg();
  // aiming overlay
  if(G.state==='ready'){
    if(G.drag&&G.drag.length>1){
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#ffd23a';ctx.shadowColor='#ffd23a';ctx.shadowBlur=22;ctx.lineWidth=14;
      ctx.beginPath();G.drag.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
      const kp=kickParams(G.drag,s,false);
      if(kp){ctx.fillStyle='rgba(255,255,255,.9)';
        for(let tt=.06;tt<kp.T*.55;tt+=.05){const q=proj(s.bx+kp.vx*tt+.5*kp.ax*tt*tt,kp.vy*tt-4.9*tt*tt,kp.vz*tt);ctx.beginPath();ctx.arc(q.x,q.y,Math.max(3,5*q.s/150),0,7);ctx.fill()}}
    } else if(G.hintN<4){
      const q=proj(b.x,0,0),a=(perfT*2)%1;ctx.save();ctx.globalAlpha=1-a;ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';
      for(let i=0;i<2;i++){const y=q.y-110-a*110-i*50;ctx.beginPath();ctx.moveTo(q.x-40,y+24);ctx.lineTo(q.x,y-12);ctx.lineTo(q.x+40,y+24);ctx.stroke()}ctx.restore();
    }
  }
  ctx.restore();
  if(curTheme===3){ctx.strokeStyle='rgba(190,170,255,.28)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<130;i++){const x=(i*53.7+perfT*60)%W,y=((i*91.3+perfT*1100*(.8+(i%5)*.1))%(H+60))-30;ctx.moveTo(x,y);ctx.lineTo(x-6,y+34)}ctx.stroke()}
  for(const g of G.rings){const k=1-g.l/.7;ctx.globalAlpha=g.l/.7;ctx.strokeStyle='#fff';ctx.lineWidth=14*(1-k)+2;ctx.beginPath();ctx.arc(g.x,g.y,30+k*260,0,7);ctx.stroke();ctx.strokeStyle='#ffd23a';ctx.lineWidth=6*(1-k)+1;ctx.beginPath();ctx.arc(g.x,g.y,20+k*200,0,7);ctx.stroke();ctx.globalAlpha=1}
  for(const f of G.floats){ctx.globalAlpha=clamp(f.l,0,1);ctx.fillStyle='#ffd23a';ctx.strokeStyle='#0b1020';ctx.lineWidth=10;ctx.font='900 64px "Lilita One",Cairo,sans-serif';ctx.textAlign='center';ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1}
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.l*1.5);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.l*8);ctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);ctx.restore()}ctx.globalAlpha=1;
}

/* ============ loop ============ */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;perfT+=dt;
  G.shake=Math.max(0,G.shake-dt*40);G.cheer-=dt;
  G.dscore+=(G.score-G.dscore)*Math.min(1,dt*9);{const ds=Math.round(G.dscore);if(ds!==G._ds){G._ds=ds;$('#hScore').textContent=ds}}
  if(G.state==='menu'&&Math.random()<dt*14)parts.push({x:Math.random()*W,y:H*.2+Math.random()*H*.7,vx:(Math.random()-.5)*20,vy:-30-Math.random()*40,g:0,l:2.5+Math.random()*2,c:['#ffd23a','#fff','#7dff8a','#38bff2'][(Math.random()*4)|0],r:1.5+Math.random()*2.5});
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.y-=120*dt;f.l-=dt;if(f.l<=0)G.floats.splice(i,1)}
  for(let i=G.rings.length-1;i>=0;i--){G.rings[i].l-=dt;if(G.rings[i].l<=0)G.rings.splice(i,1)}
  const sdt=G.slowT>0?dt*.35:dt;G.slowT-=dt;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.vy+=(p.g===undefined?1500:p.g)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.l<=0)parts.splice(i,1)}
  if(G.running&&!G.paused){
    if(G.mode==='blitz'&&G.time>0){G.time-=dt;if(G.time<=0){G.time=0;if(G.state==='ready')gameOver('timeup')}hud()}
    if(G.state==='kicking'){G.kickT+=dt;if(G.kickT>=.17)launch()}
    if(G.state==='flight'){acc+=sdt;while(acc>=1/120&&G.state==='flight'){stepFlight(1/120);acc-=1/120}}
    else{acc=0;G.wallT+=dt}
  }
  render();requestAnimationFrame(frame);
}

/* ============ menus ============ */
function applyLang(){
  document.documentElement.lang=S.lang;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#bLang').textContent=S.lang==='ar'?'EN':'AR';
  $('#nameIn').placeholder=t('name');
}
function refreshMenu(){
  $('#seasonN').textContent=S.points.toLocaleString('en');$('#bestE').textContent=S.best.endless;$('#bestB').textContent=S.best.blitz;
  $('#streakN').textContent=(S.daily.last===dayKey()||S.daily.last===yesterdayKey())?S.daily.streak:0;
  $('#bSound').textContent=S.sound?'🔊':'🔇';
  const g=$('#titleBall').getContext('2d');g.clearRect(0,0,120,120);drawBall(g,60,60,52,SKINS[S.ball]||SKINS[0],.6,.9);
}
let rankTab='endless';
function renderRanks(){
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===rankTab));
  const list=S.runs.filter(r=>r.mode===rankTab).sort((a,b)=>b.score-a.score).slice(0,10);
  $('#rlist').innerHTML=list.length?list.map((r,i)=>{const d=new Date(r.date);return'<div class="rrow"><b>'+(i+1)+'</b><span>'+esc(r.name||'')+'</span><i>'+d.getDate()+'/'+(d.getMonth()+1)+'</i><strong>'+r.score+'</strong></div>'}).join(''):'<div class="note">'+t('empty')+'</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderBalls(){
  const g=$('#bgrid');g.innerHTML='';
  SKINS.forEach((sk,i)=>{
    const open=S.points>=sk.need,c=document.createElement('div');
    c.className='bcell'+(S.ball===i?' sel':'')+(open?'':' lock');
    const cn=document.createElement('canvas');cn.width=cn.height=200;cn.style.width=cn.style.height='140px';
    drawBall(cn.getContext('2d'),100,100,90,sk,.5+i,.8);
    c.appendChild(cn);
    c.insertAdjacentHTML('beforeend','<div>'+t(sk.k)+'</div><small>'+(S.ball===i?t('selected'):open?'':'🔒 '+t('unlock')+' '+sk.need)+'</small>');
    c.onclick=()=>{if(open){S.ball=i;save();renderBalls();refreshMenu()}};
    g.appendChild(c);
  });
}
function openPanel(id){$('#menu').classList.add('hidden');$('#'+id).classList.remove('hidden');if(id==='ranks'){$('#nameIn').value=S.name;renderRanks()}else renderBalls()}
$('#bEndless').onclick=()=>startGame('endless');
$('#bDaily').onclick=()=>startGame('daily');
$('#bBlitz').onclick=()=>startGame('blitz');
$('#bRanks').onclick=()=>openPanel('ranks');
$('#bBalls').onclick=()=>openPanel('balls');
$$('[data-back]').forEach(b=>b.onclick=toMenu);
$$('.tab').forEach(b=>b.onclick=()=>{rankTab=b.dataset.tab;renderRanks()});
$('#nameIn').oninput=e=>{S.name=e.target.value.slice(0,14);save()};
$('#btnPause').onclick=pauseGame;
$('#bSound').onclick=()=>{ensureAudio();S.sound=!S.sound;if(!S.sound)stopAmbient();save();refreshMenu()};
$('#bLang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang();refreshMenu()};

addEventListener('resize',resize);
resize();applyLang();previewSetup();refreshMenu();
requestAnimationFrame(frame);

// test hooks (harmless in production)
window.__ck={launch,SFX,startAmbient,stopAmbient,ensureAudio,G,S,kickParams,kick,stepFlight,startGame,nextShot,get state(){return G.state}};
</script>
